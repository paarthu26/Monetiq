project_id = "qljpfonukbzhefuqvpuo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Largest staging bucket limit (bank statements / loan documents).
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Email verification is required before a session is considered established.
enable_confirmations = true

# Google Sign-In (PRD 6.1). Secrets come from the environment, never this file.
# NOTE: as of Phase 1 handoff this provider is NOT yet enabled on the hosted
# project — see the Phase 1 report. Enable it in Dashboard > Authentication >
# Providers, or by applying this config with the CLI.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.process-receipt]
verify_jwt = true

[functions.process-bank-statement]
verify_jwt = true

[functions.process-loan-document]
verify_jwt = true

[functions.ai-chat]
verify_jwt = true

[functions.ai-loan-suggestion]
verify_jwt = true

[functions.manage-ai-key]
verify_jwt = true
